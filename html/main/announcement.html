<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공지사항</title>
    <link rel="stylesheet" href="../../css/header.css">
    <link rel="stylesheet" href="../../css/announcement.css">
    <link rel="stylesheet" href="../../css/auth/login_page.css">
    <link rel="stylesheet" href="../../css/auth/user_menu.css">
</head>

<body>
    <!-- 헤더 자리. html/components/header.html의 내용을 header.js가 채웁니다.
         data-active는 내비게이션에서 현재 페이지를 표시할 대상을 알려줍니다.
         안쪽 링크는 헤더를 불러오지 못했을 때 남는 폴백입니다. -->
    <div id="header-root" data-active="notice">
        <a href="../../index.html" aria-label="메인 페이지로 이동">봄내로그</a>
    </div>

    <div id="announcement-page">
        <aside class="side-space"></aside>
        <main class="detail-space">
            <section class="announcement-wrap">
                <div class="announcement-header">
                    <h1>공지사항</h1>
                    <button type="button" class="announcement-write-btn" id="openAnnouncementModal">글쓰기</button>
                </div>

                <div class="announcement-list" id="announcementList"></div>
                <div class="announcement-pagination" id="announcementPagination"></div>
            </section>
        </main>
        <aside class="side-space"></aside>
    </div>

    <div class="announcement-modal-overlay" id="announcementModal" aria-hidden="true">
        <div class="announcement-modal" role="dialog" aria-modal="true" aria-labelledby="announcementModalTitle">
            <div class="announcement-modal-header">
                <h2 id="announcementModalTitle">새 공지사항 작성</h2>
                <button type="button" class="announcement-modal-close" id="closeAnnouncementModal"
                    aria-label="닫기">×</button>
            </div>

            <form id="announcementForm">
                <div class="form-group">
                    <label for="announcementTag">카테고리</label>
                    <select id="announcementTag" name="tag">
                        <option value="공지">공지</option>
                        <option value="이벤트">이벤트</option>
                        <option value="업데이트">업데이트</option>
                        <option value="점검">점검</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="announcementTitle">제목</label>
                    <input type="text" id="announcementTitle" name="title" placeholder="제목을 입력하세요" required>
                </div>

                <div class="form-group">
                    <label for="announcementContent">내용</label>
                    <textarea id="announcementContent" name="content" rows="6" placeholder="공지 내용을 입력하세요"
                        required></textarea>
                </div>

                <div class="modal-actions">
                    <button type="button" class="cancel-btn" id="cancelAnnouncementModal">취소</button>
                    <button type="submit" class="submit-btn">등록하기</button>
                </div>
            </form>
        </div>
    </div>

    <div id="login-modal-root"></div>

    <script src="../../js/announcement.js" defer></script>
    <script src="../../js/auth/auth.js"></script>
    <script src="../../js/auth/login.js"></script>
    <script src="../../js/auth/profileMenu.js"></script>
    <script src="../../js/header.js" data-header-component="../components/header.html"></script>
    <script src="../../js/auth/login_modal.js" data-login-component="../auth/login_page.html"></script>
    <script src="../../js/restaurantData.js"></script>
    <script src="../../js/headerSearch.js"></script>
</body>

</html>
