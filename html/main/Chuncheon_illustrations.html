<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>춘천 15개 동 일러스트 | 봄내로그</title>
<style>
  :root {
    --bg: #fdfcfa;
    --ink: #2b2b28;
    --ink-soft: #6b6b64;
    --line: #ece8e0;
    --sage: #8faa8b;
    --sage-soft: #e7efe4;
    --blush: #d98f7f;
    --blush-soft: #faeeec;
    --sand: #c9a97e;
    --sand-soft: #efe6d8;
    --sky: #9db9d9;
    --sky-soft: #e6eef7;
    --cream: #e8c975;
    --cream-soft: #fbf3df;
  }
 
  * { margin: 0; padding: 0; box-sizing: border-box; }
 
  body {
    font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
 
  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 72px 24px 80px;
  }
 
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--sage);
    font-weight: 700;
    background: var(--sage-soft);
    padding: 7px 16px;
    border-radius: 999px;
    margin-bottom: 20px;
  }
 
  h1 {
    font-size: clamp(26px, 4vw, 36px);
    font-weight: 800;
    letter-spacing: -0.02em;
    margin-bottom: 12px;
  }
 
  .sub {
    color: var(--ink-soft);
    font-size: 15.5px;
    margin-bottom: 48px;
    max-width: 560px;
  }
 
  .grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 28px 20px;
  }
 
  @media (max-width: 900px) {
    .grid { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 560px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
  }
 
  .badge {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
 
  .badge .circle {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 50%;
    overflow: hidden;
    border: 1px solid var(--line);
    box-shadow: 0 8px 20px rgba(43, 43, 40, 0.05);
    transition: transform 0.2s ease;
  }
 
  .badge:hover .circle { transform: translateY(-4px); }
 
  .badge .circle svg { width: 100%; height: 100%; display: block; }
 
  .badge .name {
    font-size: 14.5px;
    font-weight: 700;
    text-align: center;
  }
 
  footer {
    margin-top: 56px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    font-size: 12.5px;
    color: var(--ink-soft);
  }
</style>
</head>
<body>
  <div class="wrap">

</html>
