<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 활동</title>
    <link rel="stylesheet" href="../../css/header.css">
    <link rel="stylesheet" href="../../css/announcement.css">
    <link rel="stylesheet" href="../../css/auth/login_page.css">
    <link rel="stylesheet" href="../../css/auth/user_menu.css">
</head>

<body>
    <!-- 상단 메뉴 중 해당 항목이 없는 페이지라 빈 값 -->
    <div id="header-root" data-active="">
        <a href="../../index.html" aria-label="메인 페이지로 이동">봄내로그</a>
    </div>

    <div id="review-page">
        <aside class="side-space"></aside>
        <main class="detail-space">
            <section class="announcement-wrap">
                <div class="announcement-header">
                    <h1>내 활동</h1>
                </div>

                <!-- 탭 항목은 여기 button 한 줄로 관리. data-tab 값이 my_activity.js의 TABS 키와 짝. -->
                <!-- 즐겨찾기 같은 걸 붙일 때 이 줄 하나 + TABS 항목 하나면 끝남 -->
                <div class="activity-tabs" id="activityTabs" role="tablist">
                    <button class="activity-tab active" type="button" role="tab" data-tab="reviews">내 리뷰</button>
                    <button class="activity-tab" type="button" role="tab" data-tab="comments">내 댓글</button>
                    <button class="activity-tab" type="button" role="tab" data-tab="favorites">즐겨찾기</button>
                </div>

                <!-- 전환은 my_activity.js가 담당 (auth:changed 구독) -->
                <div class="login-required-card" id="loginRequiredCard" hidden>
                    <h2>로그인이 필요합니다</h2>
                    <p>내가 남긴 리뷰와 댓글을 보려면 로그인해주세요.</p>
                    <button type="button" class="submit-btn" data-login-open>로그인</button>
                </div>

                <!-- 목록 자리는 하나. 탭이 바뀌면 내용만 교체됨 -->
                <div id="activityContent" hidden>
                    <div class="announcement-list" id="activityList"></div>
                    <div class="announcement-pagination" id="activityPagination"></div>
                </div>
            </section>
        </main>
        <aside class="side-space"></aside>
    </div>

    <div id="login-modal-root"></div>

    <!-- 순서 주의: my_activity.js가 아래 셋의 함수를 씀 -->
    <!--   auth.js           → getCurrentUser -->
    <!--   restaurantData.js → getRestaurantData -->
    <!--   board.js          → Board / ReviewBoard / RestaurantKey -->
    <!--   favorites.js      → getFavoriteIds / toggleFavorite -->
    <!-- 먼저 두면 ReferenceError로 my_activity.js 전체가 죽음 -->
    <script src="../../js/auth/auth.js"></script>
    <script src="../../js/auth/favorites.js"></script>
    <script src="../../js/auth/login.js"></script>
    <script src="../../js/auth/profileMenu.js"></script>
    <script src="../../js/header.js" data-header-component="../components/header.html"></script>
    <script src="../../js/auth/login_modal.js" data-login-component="../auth/login_page.html"></script>
    <script src="../../js/restaurantData.js"></script>
    <script src="../../js/headerSearch.js"></script>
    <script src="../../js/board.js"></script>
    <script src="../../js/my_activity.js"></script>
</body>

</html>
