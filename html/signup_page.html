<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>

    <link rel="stylesheet" href="../css/signup_page.css">
</head>

<body>
    <div class="signup-container">
        <h2>회원가입</h2>

        <form id="signupForm">
            <div class="input-group">
                <label for="signupId">아이디</label>
                <input type="text" id="signupId" name="userId" placeholder="영문으로 시작하는 4~16자" autocomplete="username"
                    required>
                <span class="msg" id="idMsg"></span>
            </div>

            <div class="input-group">
                <label for="signupPw">비밀번호</label>
                <input type="password" id="signupPw" name="userPw" placeholder="영문+숫자 조합 8~16자"
                    autocomplete="new-password" required>
                <span class="msg" id="pwMsg"></span>
            </div>

            <div class="input-group">
                <label for="signupPw2">비밀번호 확인</label>
                <input type="password" id="signupPw2" name="userPw2" placeholder="비밀번호를 다시 입력하세요"
                    autocomplete="new-password" required>
                <span class="msg" id="pw2Msg"></span>
            </div>

            <div class="input-group">
                <label for="signupName">이름</label>
                <input type="text" id="signupName" name="userName" placeholder="한글 2~5자" autocomplete="name" required>
                <span class="msg" id="nameMsg"></span>
            </div>

            <div class="input-group">
                <label for="signupEmail">이메일</label>
                <input type="text" id="signupEmail" name="userEmail" placeholder="example@domain.com"
                    autocomplete="email" required>
                <span class="msg" id="emailMsg"></span>
            </div>

            <div class="agree-group">
                <label>
                    <input type="checkbox" id="signupAgree">
                    <strong>[필수]</strong> 이용약관 및 개인정보 처리방침에 동의합니다
                </label>
            </div>

            <p class="msg" id="signupMsg"></p>

            <button type="submit" class="btn btn-signup">가입하기</button>
            <a href="../index.html" class="btn btn-cancel">취소</a>
        </form>
    </div>

    <script src="../js/auth.js"></script>
    <script src="../js/signup.js"></script>
</body>

</html>
