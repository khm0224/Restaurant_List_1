<!-- 공통 헤더 마크업. js/header.js가 fetch로 읽어 각 페이지에 삽입합니다. -->
<!-- WHY: href/src를 비워두고 data-*에 담은 이유 -->
<!--   이 파일 하나가 서로 다른 폴더 깊이의 페이지에 삽입됩니다. -->
<!--   상대경로를 그대로 두면 삽입된 페이지 기준으로 계산돼 페이지마다 깨집니다. -->
<!--   header.js가 이 파일의 주소를 기준으로 다시 계산해 넣습니다. -->
<header class="header">
    <div class="logo">
        <a class="logo-link" data-header-link="../../index.html" aria-label="메인 페이지로 이동">
            <img data-header-src="../../img/logoimg.png" alt="logo">
        </a>
    </div>

    <!-- 상단 카테고리 -->
    <!-- WHY: data-nav — 현재 페이지 표시를 붙일 대상을 찾는 이름표 -->
    <nav class="nav">
        <a data-header-link="../main/main_info.html"     data-nav="info">맛집리스트 소개</a>
        <a data-header-link="../main/news.html"          data-nav="news">새로운 소식</a>
        <a data-header-link="../main/announcement.html"  data-nav="notice">공지사항</a>
    </nav>

    <div class="header-right">
        <div class="search-box">
            <input type="text" placeholder="메뉴를 검색하시오..">
            <span class="search-btn">🔍</span>
        </div>

        <!-- 비로그인 상태에서만 표시. 토글은 login.js updateHeader() 담당 -->
        <button type="button" id="login_Btn" class="login-btn" data-login-open aria-label="로그인">로그인</button>

        <!-- 로그인 상태에서만 표시. 제어는 profileMenu.js 담당 -->
        <div class="user-menu" id="userMenu" hidden>
            <button class="user-menu__trigger" id="userMenuTrigger" type="button" aria-haspopup="true"
                aria-expanded="false" aria-controls="userMenuPanel">
                <img class="user-menu__avatar" id="userMenuAvatar" data-header-src="../../img/profile-default.png" alt="">
                <span class="user-menu__name" id="userMenuName"></span>
                <span class="user-menu__caret" aria-hidden="true"></span>
            </button>

            <div class="user-menu__panel" id="userMenuPanel" role="menu" hidden>
                <!-- 기능 추가 지점: li 한 줄만 추가하면 되고 JS 수정은 불필요 -->
                <ul class="user-menu__list">
                    <li><a class="user-menu__item" role="menuitem" data-header-link="../my_info.html">개인정보 변경</a></li>
                    <li><a class="user-menu__item" role="menuitem" data-header-link="../my_reviews.html">내가 쓴 리뷰</a></li>
                </ul>

                <div class="user-menu__divider"></div>
                <button class="user-menu__item user-menu__item--danger" id="userMenuLogout" type="button"
                    role="menuitem">로그아웃</button>
            </div>
        </div>
    </div>
</header>
