<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>맛집 추천</title>
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/food_page.css">
    <link rel="stylesheet" href="../css/favorites.css">
    <link rel="stylesheet" href="../css/auth/login_page.css">
    <link rel="stylesheet" href="../css/auth/user_menu.css">
</head>

<body>
    <!-- 식당 탐색 화면 전체 영역 -->
    <div id="container">
        <!-- 헤더 자리. html/components/header.html의 내용을 header.js가 채웁니다.
             data-active는 내비게이션에서 현재 페이지를 표시할 대상을 알려줍니다.
             안쪽 링크는 헤더를 불러오지 못했을 때 남는 폴백입니다. -->
        <div id="header-root" data-active="">
            <a href="../index.html" aria-label="메인 페이지로 이동">봄내로그</a>
        </div>

        <!-- 식당 카테고리 선택 버튼 -->
        <div id="function-bar">
            <div class="function-bar-nav">
                <button class="function-scroll-btn" id="function-scroll-prev" type="button"
                    aria-label="이전 동 보기">&lsaquo;</button>
                <div class="category-scroll" id="category-scroll">
                    <div class="category-wrap">
                        <button class="category-btn active" data-category="전체" aria-pressed="true">전체</button>
                        <button class="category-btn" data-category="소양동" aria-pressed="false">소양동</button>
                        <button class="category-btn" data-category="교동" aria-pressed="false">교동</button>
                        <button class="category-btn" data-category="조운동" aria-pressed="false">조운동</button>
                        <button class="category-btn" data-category="약사명동" aria-pressed="false">약사명동</button>
                        <button class="category-btn" data-category="근화동" aria-pressed="false">근화동</button>
                        <button class="category-btn" data-category="후평1동" aria-pressed="false">후평1동</button>
                        <button class="category-btn" data-category="후평2동" aria-pressed="false">후평2동</button>
                        <button class="category-btn" data-category="후평3동" aria-pressed="false">후평3동</button>
                        <button class="category-btn" data-category="효자1동" aria-pressed="false">효자1동</button>
                        <button class="category-btn" data-category="효자2동" aria-pressed="false">효자2동</button>
                        <button class="category-btn" data-category="효자3동" aria-pressed="false">효자3동</button>
                        <button class="category-btn" data-category="석사동" aria-pressed="false">석사동</button>
                        <button class="category-btn" data-category="퇴계동" aria-pressed="false">퇴계동</button>
                        <button class="category-btn" data-category="강남동" aria-pressed="false">강남동</button>
                        <button class="category-btn" data-category="신사우동" aria-pressed="false">신사우동</button>
                    </div>
                </div>
                <button class="function-scroll-btn" id="function-scroll-next" type="button"
                    aria-label="다음 동 보기">&rsaquo;</button>
            </div>
        </div>
        <!-- 식당 목록과 카카오 지도 영역 -->
        <div id="content">
            <div id="side-bar">
                <div class="sidebar-toolbar">
                    <button id="sidebar-toggle" type="button" aria-label="식당 목록 숨기기" aria-expanded="true"
                        aria-controls="side-bar">
                        <span aria-hidden="true">☰</span>
                    </button>
                    <button id="favorites-button" type="button" aria-label="즐겨찾기" aria-pressed="false">
                        <span aria-hidden="true">★</span>
                    </button>
                    <div class="sidebar-category-control">
                        <label for="sidebar-category-select">카테고리</label>
                        <select id="sidebar-category-select" style="width: 300px;">
                            <option value="전체">전체</option>
                            <option value="한식">한식</option>
                            <option value="일식">일식</option>
                            <option value="중식">중식</option>
                            <option value="양식">양식</option>
                            <option value="디저트">디저트</option>
                        </select>
                    </div>
                </div>
                <div id="store-list"></div>
            </div>
            <div id="map-area">
                <div id="map-api" aria-label="카카오 지도"></div>
                <div id="map-route-context-menu" class="map-route-context-menu" role="menu"
                    aria-label="지도 위치 길찾기 설정" hidden>
                    <button type="button" role="menuitem" data-route-point="origin">
                        <span class="route-point-pin is-origin" aria-hidden="true">출</span>
                        <span>출발지 지정</span>
                    </button>
                    <button type="button" role="menuitem" data-route-point="destination">
                        <span class="route-point-pin is-destination" aria-hidden="true">도</span>
                        <span>도착지 지정</span>
                    </button>
                </div>
                <div class="map-controls" id="map-controls" hidden>
                    <div class="map-zoom-controls" aria-label="지도 확대 및 축소">
                        <button class="map-control-btn map-zoom-btn" id="map-zoom-in" type="button"
                            aria-label="지도 확대">+</button>
                        <button class="map-control-btn map-zoom-btn" id="map-zoom-out" type="button"
                            aria-label="지도 축소">−</button>
                    </div>
                    <button class="map-control-btn map-location-btn" id="map-current-location" type="button"
                        aria-label="내 위치 실시간 추적" aria-pressed="false">
                        <span class="map-location-icon" aria-hidden="true"></span>
                        <span id="map-location-label">내 위치</span>
                    </button>
                    <button
                        class="map-control-btn map-route-btn"
                        id="map-route-search"
                        type="button"
                        aria-label="경로 탐색"
                        aria-expanded="false"
                        aria-controls="route-panel"
                    >
                        <span class="map-route-icon" aria-hidden="true">➤</span>
                        <span>경로 탐색</span>
                    </button>
                </div>
                <div id="route-panel" class="route-panel" hidden>
                    <div class="route-panel-header">
                        <h2>길찾기</h2>
                        <button id="route-panel-close" type="button" aria-label="길찾기 닫기">×</button>
                    </div>

                    <label>
                        출발지
                        <span class="route-input-row">
                            <input id="route-origin" type="text" placeholder="출발지 입력">
                            <button class="route-input-clear" type="button" data-clear-route-point="origin"
                                aria-label="출발지 지우기">×</button>
                        </span>
                    </label>

                    <label>
                        도착지
                        <span class="route-input-row">
                            <input id="route-destination" type="text" placeholder="도착지 입력">
                            <button class="route-input-clear" type="button" data-clear-route-point="destination"
                                aria-label="도착지 지우기">×</button>
                        </span>
                    </label>

                    <button id="route-submit" type="button">경로 찾기</button>
                </div>
                <div id="map-loader">
                    <div class="map-loader-card">
                        <h2>카카오 지도 연결</h2>
                        <p id="map-status">지도를 불러오는 중입니다…</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript가 로그인 모달을 삽입하는 위치 -->
    <div id="login-modal-root"></div>

    <!-- 페이지 기능에 필요한 스크립트 -->
    <script src="../js/map-config-KakaoJS.js"></script>
    <script src="../js/restaurantData.js"></script>
    <script src="../js/restaurantService.js"></script>
    <script src="../js/geolocationService.js"></script>
    <script src="../js/restaurantMap.js"></script>
    <script src="../js/auth/auth.js"></script>
    <script src="../js/auth/favorites.js"></script>
    <script src="../js/restaurantExplorer.js"></script>
    <script src="../js/directionsController.js"></script>
    <script src="../js/food_page.js"></script>
    <script src="../js/headerSearch.js"></script>
    <script src="../js/auth/login.js"></script>
    <script src="../js/auth/profileMenu.js"></script>
    <script src="../js/header.js" data-header-component="./components/header.html"></script>
    <script src="../js/auth/login_modal.js" data-login-component="./auth/login_page.html"></script>
</body>

</html>
