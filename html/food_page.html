<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>맛집 추천</title>
    <link rel="stylesheet" href="../css/food_page.css">
    <link rel="stylesheet" href="../css/login_page.css">
</head>
<body>
<div id="container">
    <div id="top-bar">
        <div class="top-left">
            <img src="../img/mainLogo.png" alt="logo" class="logo-img">
        </div>

        <div class="top-center">
            <input type="text" class="search-box" placeholder="검색어를 입력하세요" aria-label="검색">
        </div>

        <div class="top-right">
            <button type="button" class="login-btn" data-login-open>로그인</button>
        </div>
    </div>

    <div id="function-bar">
        <div class="category-wrap">
            <button class="category-btn active" data-category="한식" aria-pressed="true">한식</button>
            <button class="category-btn" data-category="일식" aria-pressed="false">일식</button>
            <button class="category-btn" data-category="중식" aria-pressed="false">중식</button>
            <button class="category-btn" data-category="양식" aria-pressed="false">양식</button>
            <button class="category-btn" data-category="디저트" aria-pressed="false">디저트</button>
        </div>
    </div>

    <div id="content">
        <button id="sidebar-toggle" type="button" aria-label="식당 목록 숨기기" aria-expanded="true" aria-controls="side-bar">
            <span aria-hidden="true">☰</span>
        </button>
        <div id="side-bar">
            <div id="store-list"></div>
        </div>
        <div id="map-area">
            <div id="map-api" aria-label="Google 지도"></div>
            <div id="map-loader">
                <div class="map-loader-card">
                    <h2>Google 지도 연결</h2>
                    <p id="map-status">지도를 불러오는 중입니다…</p>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="login-modal-root"></div>

<script src="../js/map-config.js"></script>
<script src="../js/restaurantData.js"></script>
<script src="../js/food_page.js"></script>
<script src="../js/login_modal.js" data-login-component="./login_page.html"></script>
</body>
</html>
