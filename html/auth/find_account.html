<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아이디 / 비밀번호 찾기</title>

    <link rel="stylesheet" href="../../css/auth/find_account.css">
</head>

<body>
    <div class="find-container">
        <h2>계정 찾기</h2>

        <div class="tab-menu">
            <button type="button" class="tab active" data-tab="findIdPanel">아이디 찾기</button>
            <button type="button" class="tab" data-tab="findPwPanel">비밀번호 찾기</button>
        </div>

        <!-- 아이디 찾기 -->
        <div class="tab-panel active" id="findIdPanel">
            <div class="input-group">
                <label for="findName">이름</label>
                <input type="text" id="findName" placeholder="가입 시 입력한 이름">
            </div>
            <div class="input-group">
                <label for="findEmail">이메일</label>
                <input type="text" id="findEmail" placeholder="example@domain.com">
            </div>
            <button type="button" id="findIdBtn">아이디 찾기</button>
            <p class="msg" id="findIdMsg"></p>
        </div>

        <!-- 비밀번호 재설정 -->
        <div class="tab-panel" id="findPwPanel">
            <div class="input-group">
                <label for="resetId">아이디</label>
                <input type="text" id="resetId" placeholder="가입한 아이디">
            </div>
            <div class="input-group">
                <label for="resetEmail">이메일</label>
                <input type="text" id="resetEmail" placeholder="example@domain.com">
            </div>
            <div class="input-group">
                <label for="resetPw">새 비밀번호</label>
                <input type="password" id="resetPw" placeholder="영문+숫자+특수문자 8~16자" autocomplete="new-password">
            </div>
            <button type="button" id="resetPwBtn">비밀번호 재설정</button>
            <p class="msg" id="resetPwMsg"></p>
        </div>

        <a href="../../index.html">메인으로</a>
    </div>

    <script src="../../js/auth/auth.js"></script>
    <script src="../../js/auth/findAccount.js"></script>
</body>

</html>
