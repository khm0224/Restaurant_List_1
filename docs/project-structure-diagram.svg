  <rect x="665" y="575" width="220" height="82" class="node"/>
  <text x="775" y="608" class="label">내 활동</text>
  <text x="775" y="634" class="small">user_information/my_activity.html</text>

  <rect x="365" y="755" width="220" height="82" class="node"/>
  <text x="475" y="788" class="label">공지사항</text>
  <text x="475" y="814" class="small">main/announcement.html</text>

  <rect x="665" y="755" width="220" height="82" class="node"/>
  <text x="775" y="788" class="label">춘천 소식</text>
  <text x="775" y="814" class="small">main/news.html</text>

  <!-- Shared logic -->
  <rect x="990" y="225" width="200" height="76" class="node"/>
  <text x="1090" y="256" class="label">검색·필터</text>
  <text x="1090" y="282" class="small">headerSearch · Explorer</text>

