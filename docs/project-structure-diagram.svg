<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#153c2c" flood-opacity=".14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7b9f90"/>
    </marker>
    <style>
      .title{font:700 38px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#173d2e}
      .subtitle{font:400 18px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#668176}
      .section{font:700 18px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;letter-spacing:1px;fill:#527064}
      .node{fill:#fffaf0;stroke:#234d3c;stroke-width:2;rx:14;filter:url(#shadow)}
      .node-main{fill:#e8f4ed;stroke:#1c6749;stroke-width:2.5;rx:16;filter:url(#shadow)}
      .node-data{fill:#edf3f8;stroke:#56758c;stroke-width:2;rx:14;filter:url(#shadow)}
      .node-store{fill:#f7edff;stroke:#76598a;stroke-width:2;rx:14;filter:url(#shadow)}
      .label{font:700 20px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#183b2e;text-anchor:middle}
      .small{font:400 14px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#667a72;text-anchor:middle}
      .line{fill:none;stroke:#8bad9f;stroke-width:2.2;marker-end:url(#arrow)}
      .line-soft{fill:none;stroke:#b4c8bf;stroke-width:1.8;stroke-dasharray:7 6;marker-end:url(#arrow)}
      .group{fill:#ffffff;stroke:#d9e7e0;stroke-width:1.5;rx:24}
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#fbfaf6"/>
  <rect x="0" y="0" width="1600" height="12" fill="#173d2e"/>
  <text x="70" y="72" class="title">봄내로그 · 프로젝트 구조도</text>
  <text x="70" y="105" class="subtitle">Restaurant_List — 화면, 공통 기능, 데이터 흐름을 중심으로 정리</text>

  <text x="70" y="160" class="section">01  ENTRY</text>
  <text x="355" y="160" class="section">02  PAGES</text>
  <text x="975" y="160" class="section">03  SHARED LOGIC</text>
  <text x="1280" y="160" class="section">04  DATA / STORAGE</text>

  <rect x="45" y="180" width="250" height="750" class="group"/>
  <rect x="325" y="180" width="600" height="750" class="group"/>
  <rect x="955" y="180" width="270" height="750" class="group"/>
