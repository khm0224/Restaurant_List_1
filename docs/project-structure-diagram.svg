  <text x="1090" y="657" class="small">Detail · Board</text>

  <rect x="990" y="725" width="200" height="76" class="node"/>
  <text x="1090" y="756" class="label">공통 UI</text>
  <text x="1090" y="782" class="small">header.js · CSS</text>

  <!-- Data -->
  <rect x="1290" y="225" width="230" height="82" class="node-data"/>
  <text x="1405" y="258" class="label">음식점 데이터</text>
  <text x="1405" y="284" class="small">restaurantData.js</text>

  <rect x="1290" y="365" width="230" height="82" class="node-data"/>
  <text x="1405" y="398" class="label">CSV 원본·가공본</text>
  <text x="1405" y="424" class="small">전국_음식점_정보csv/</text>

  <rect x="1290" y="505" width="230" height="82" class="node-data"/>
  <text x="1405" y="538" class="label">지도 경계 데이터</text>
  <text x="1405" y="564" class="small">data/area/*.geojson</text>

  <rect x="1290" y="645" width="230" height="82" class="node-store"/>
  <text x="1405" y="678" class="label">브라우저 저장소</text>
