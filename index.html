<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>맛집 추천</title>
    <!-- CSS 스타일시트 통합 -->
    <link rel="stylesheet" href="./css/main_page_style.css">
    <link rel="stylesheet" href="./css/login_page.css">
</head>

<body>
    <header class="header">
        <div class="logo">
            <span class="logo-icon">🍗</span> <!--상단 로고 이미지 -->
            <span>로고이름</span> <!--상단 로고 텍스트 -->
        </div>

        <!-- ============ 카테고리1 (상단) ============ -->
        <nav class="nav">
            <a href="#">상단1</a> <!-- 상단 카테고리 버튼1-->
            <a href="#">상단2</a>
            <a href="#">상단3</a>
            <a href="#">상단4</a>
            <a href="#">상단5</a>
        </nav>
        <div class="header-right">
            <div class="search-box">
                <input type="text" placeholder="메뉴를 검색하시오..">
                <span class="search-btn">🔍</span>
            </div>
            <button type="button" class="login-btn" data-login-open aria-label="로그인">로그인</button>
        </div>
    </header>


    <!-- ============ 히어로 섹션 (맛집 카드 캐러셀) ============ -->
    <section class="hero" id="heroSlider">

        <div class="hero-track" id="heroTrack">

            <div class="hero-card">
                <div class="hero-card-img" style="background-color: brown;"></div>
                <div class="hero-card-info">
                    <span class="hero-card-tag">임의</span>
                    <h3 class="hero-card-name">임의</h3>
                    <p class="hero-card-desc">임의</p>
                    <div class="hero-card-rating">★ 임의</div>
                    <a href="#" class="hero-cta">맛집으로 이동 ›</a>
                </div>
            </div>

            <div class="hero-card">
                <div class="hero-card-img" style="background-color: red;"></div>
                <div class="hero-card-info">
                    <span class="hero-card-tag">임의</span>
                    <h3 class="hero-card-name">임의</h3>
                    <p class="hero-card-desc">임의</p>
                    <div class="hero-card-rating">★ 임의</div>
                    <a href="#" class="hero-cta">맛집으로 이동 ›</a>
                </div>
            </div>

            <div class="hero-card">
                <div class="hero-card-img" style="background-color: blue;"></div>
                <div class="hero-card-info">
                    <span class="hero-card-tag">임의</span>
                    <h3 class="hero-card-name">임의</h3>
                    <p class="hero-card-desc">임의</p>
                    <div class="hero-card-rating">★ 임의</div>
                    <a href="#" class="hero-cta">맛집으로 이동 ›</a>
                </div>
            </div>

            <div class="hero-card">
                <div class="hero-card-img" style="background-color: black;"></div>
                <div class="hero-card-info">
                    <span class="hero-card-tag">한식 · 고기</span>
                    <h3 class="hero-card-name">우리동네 삼겹살</h3>
                    <p class="hero-card-desc">숯불에 구운 국내산 삼겹살</p>
                    <div class="hero-card-rating">★ 4.7</div>
                    <a href="#" class="hero-cta">맛집으로 이동 ›</a>
                </div>
            </div>

        </div>

        <button type="button" class="hero-arrow prev" id="heroPrev" aria-label="이전 맛집">‹</button>
        <button type="button" class="hero-arrow next" id="heroNext" aria-label="다음 맛집">›</button>

        <div class="hero-pagination" id="heroPagination"></div>

    </section>

    <!-- ============ 카테고리2 (중앙) ============ -->
    <div class="category-bar">
        <button class="chip active">필터 초기화</button>
        <button class="chip">필터1</button>
        <button class="chip">필터2</button>
        <button class="chip">필터3</button>
        <button class="chip">필터4</button>
        <button class="chip">필터5</button>
        <button class="chip">필터6</button>
    </div>

    <!-- ============ top list ============ -->
    <section class="section">
        <div class="section-head">
            <h2>top list</h2>
            <a href="#" class="more-link">더보기 ›</a>
        </div>

        <div class="restaurant-grid">
            <div class="r-card-placeholder">음식점1</div>
            <div class="r-card-placeholder">음식점2</div>
            <div class="r-card-placeholder">음식점3</div>
            <div class="r-card-placeholder">음식점4</div>
            <div class="r-card-placeholder">음식점5</div>
        </div>
    </section>

    <!-- ============ 지도 섹션 ============ -->
    <section class="homepage-map">
        <div class="section-head">
            <h2>주변 맛집 지도</h2>
            <a href="./html/food_page.html" class="more-link">
                크게 보기 ›
            </a>
        </div>
        <div id="homepage-map">
            <p id="homepage-map-status">지도를 불러오는 중입니다…</p>
        </div>
    </section> 

    <div id="login-modal-root"></div>

    <!-- 스크립트 연결 -->
    <script src="./js/map-config.js"></script>
    <script src="./js/main.js"></script>
    <script src="./js/main_hero-slider.js"></script>
    <script src="./js/login_modal.js" data-login-component="./html/login_page.html"></script>
</body>

</html>
