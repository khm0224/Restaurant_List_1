<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>봄내로그</title>
    <!-- CSS 스타일시트 통합 -->
    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/main_page_style.css">
    <link rel="stylesheet" href="./css/auth/login_page.css">
    <link rel="stylesheet" href="./css/auth/user_menu.css">
</head>

<body>
    <!-- 헤더 자리. js/header.js가 채웁니다.
     안쪽 내용은 fetch 실패 시 남는 폴백 — 최소한 메인으로 돌아갈 길은 남깁니다. -->
    <div id="header-root" data-active="">
        <a href="./index.html" aria-label="메인 페이지로 이동">봄내로그</a>
    </div>


    <!-- ============ 히어로 섹션 (맛집 카드) ============ -->
    <section class="hero" id="heroSlider">
        <div class="hero-track" id="heroTrack">

            <div class="hero-card">
                <div class="hero-card-img" style="background-color: brown;"></div>
                <div class="hero-card-info">
                    <span class="hero-card-tag">임의</span>
                    <h3 class="hero-card-name">임의</h3>
                    <p class="hero-card-desc">임의</p>
                    <div class="hero-card-rating">★ 임의</div>
                    <a href="#" class="hero-cta">맛집으로 이동 ›</a>
                </div>
            </div>

            <div class="hero-card">
                <div class="hero-card-img" style="background-color: red;"></div>
                <div class="hero-card-info">
                    <span class="hero-card-tag">임의</span>
                    <h3 class="hero-card-name">임의</h3>
                    <p class="hero-card-desc">임의</p>
                    <div class="hero-card-rating">★ 임의</div>
                    <a href="#" class="hero-cta">맛집으로 이동 ›</a>
                </div>
            </div>

            <div class="hero-card">
                <div class="hero-card-img" style="background-color: blue;"></div>
                <div class="hero-card-info">
                    <span class="hero-card-tag">임의</span>
                    <h3 class="hero-card-name">임의</h3>
                    <p class="hero-card-desc">임의</p>
                    <div class="hero-card-rating">★ 임의</div>
                    <a href="#" class="hero-cta">맛집으로 이동 ›</a>
                </div>
            </div>

            <div class="hero-card">
                <div class="hero-card-img" style="background-color: black;"></div>
                <div class="hero-card-info">
                    <span class="hero-card-tag">임의</span>
                    <h3 class="hero-card-name">임의</h3>
                    <p class="hero-card-desc">임의</p>
                    <div class="hero-card-rating">★ 임의</div>
                    <a href="#" class="hero-cta">맛집으로 이동 ›</a>
                </div>
            </div>

        </div>

        <button type="button" class="hero-arrow prev" id="heroPrev" aria-label="이전 맛집">‹</button>
        <button type="button" class="hero-arrow next" id="heroNext" aria-label="다음 맛집">›</button>

        <div class="hero-pagination" id="heroPagination"></div>

    </section>

    <!-- ============ 카테고리2 (지역 선택) ============ -->
    <div class="region-slider" id="regionSlider">
        <div class="region-track" id="regionTrack">

            <button class="region-item active" data-region="소양동">
                <span class="region-icon">소양</span>
                <span class="region-label">소양동</span>
            </button>

            <button class="region-item" data-region="교동">
                <span class="region-icon">교동</span>
                <span class="region-label">교동</span>
            </button>

            <button class="region-item" data-region="조운동">
                <span class="region-icon">조운</span>
                <span class="region-label">조운동</span>
            </button>

            <button class="region-item" data-region="약사명동">
                <span class="region-icon">약사명</span>
                <span class="region-label">약사명동</span>
            </button>

            <button class="region-item" data-region="근화동">
                <span class="region-icon">근화</span>
                <span class="region-label">근화동</span>
            </button>

            <button class="region-item" data-region="후평1동">
                <span class="region-icon">후평1</span>
                <span class="region-label">후평1동</span>
            </button>

            <button class="region-item" data-region="후평2동">
                <span class="region-icon">후평2</span>
                <span class="region-label">후평2동</span>
            </button>

            <button class="region-item" data-region="후평3동">
                <span class="region-icon">후평3</span>
                <span class="region-label">후평3동</span>
            </button>

            <button class="region-item" data-region="효자1동">
                <span class="region-icon">효자1</span>
                <span class="region-label">효자1동</span>
            </button>

            <button class="region-item" data-region="효자2동">
                <span class="region-icon">효자2</span>
                <span class="region-label">효자2동</span>
            </button>

            <button class="region-item" data-region="효자3동">
                <span class="region-icon">효자3</span>
                <span class="region-label">효자3동</span>
            </button>

            <button class="region-item" data-region="석사동">
                <span class="region-icon">석사</span>
                <span class="region-label">석사동</span>
            </button>

            <button class="region-item" data-region="퇴계동">
                <span class="region-icon">퇴계</span>
                <span class="region-label">퇴계동</span>
            </button>

            <button class="region-item" data-region="강남동">
                <span class="region-icon">강남</span>
                <span class="region-label">강남동</span>
            </button>

            <button class="region-item" data-region="신사우동">
                <span class="region-icon">신사우</span>
                <span class="region-label">신사우동</span>
            </button>

        </div>

        <button type="button" class="region-arrow prev" id="regionPrev" aria-label="이전 지역 목록">‹</button>
        <button type="button" class="region-arrow next" id="regionNext" aria-label="다음 지역 목록">›</button>

        <div class="region-pagination" id="regionPagination"></div>
    </div>

    <!-- ============ 지도 + top list 섹션 ============ -->
    <section class="homepage-map">
        <div class="map-toplist-row">
            <div class="map-col">
                <div class="section-head">
                    <h2>주변 맛집 지도</h2>
                    <a href="./html/food_page.html" class="more-link">
                        크게 보기 ›
                    </a>
                </div>
                <div id="homepage-map">
                    <p id="homepage-map-status">지도를 불러오는 중입니다…</p>
                </div>
            </div>

            <div class="toplist-col">
                <div class="section-head">
                    <h2>top list</h2>
                    <a href="#" class="more-link">더보기 ›</a>
                </div>
                <div class="restaurant-grid">
                    <div class="r-card-placeholder">음식점1</div>
                    <div class="r-card-placeholder">음식점2</div>
                    <div class="r-card-placeholder">음식점3</div>
                    <div class="r-card-placeholder">음식점4</div>
                    <div class="r-card-placeholder">음식점5</div>
                </div>
            </div>
        </div>
    </section>

    <div id="login-modal-root"></div>

    <!-- 로그인 관련 js -->
    <script src="./js/auth/auth.js"></script>
    <script src="./js/auth/login.js"></script>
    <script src="./js/auth/login_modal.js" data-login-component="./html/auth/login_page.html"></script>
    
    <!-- 프로필 관련 js -->
    <script src="./js/auth/profileMenu.js"></script>
    
    <script src="./js/header.js" data-header-component="./html/components/header.html"></script>

    <script src="./js/map-config.js"></script>
    <script src="./js/places-photos.js"></script>
    <script src="./js/main.js"></script>
    <script src="./js/main_hero-slider.js"></script>
    <script src="./js/region-slider.js"></script>
</body>

</html>
