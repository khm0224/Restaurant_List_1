            <div class="map-col">
                <div class="section-head">
                    <h2>주변 맛집 지도</h2>

                </div>
                <div id="homepage-map">

                </div>
            </div>

            <div class="toplist-col">
                <section class="ranking-panel" aria-labelledby="ranking-title">
                    <div class="ranking-tabs">
                        <button type="button" class="ranking-tab active" data-ranking-mode="district">
                            지역별 맛집
                        </button>
                        <button type="button" class="ranking-tab" data-ranking-mode="nearby">
                            내 주변 맛집
                        </button>
                    </div>

                    <div class="ranking-header">
                        <button type="button" id="rankingPrev" aria-label="이전 지역">‹</button>

                        <div>
                            <h2 id="ranking-title">춘천 전체 맛집</h2>
                            <p>TOP 3</p>
                        </div>

                        <button type="button" id="rankingNext" aria-label="다음 지역">›</button>
                    </div>

                    <!-- JavaScript가 음식점 카드 3개를 삽입 -->
                    <div class="ranking-list" id="homepage-ranking"></div>

                    <a
                        href="./html/food_page.html?district=전체"
                        class="ranking-more"
                        id="ranking-more"
                    >
                        춘천 맛집 전체보기 ›
                    </a>
                </section>
            </div>
        </div>
